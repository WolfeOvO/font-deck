# Public read-only font data. Other draft paths keep their gate.
location ^~ /font-deck-api/v1-r1/ {
    auth_request off;
    gzip off;
    limit_except GET { deny all; }
    try_files $uri =404;
    autoindex off;
    types { font/ttf ttf; font/woff2 woff2; application/json json; text/plain txt md; }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
}
